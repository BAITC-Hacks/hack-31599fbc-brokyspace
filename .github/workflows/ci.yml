name: AML pipeline CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run_pipeline.py --data ./data --out ./out
      - run: pytest -q
      - run: python evaluate_solution.py --out ./out
      - run: git diff --exit-code -- out/nodes_roles.csv out/clusters.csv out/top_nodes.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aml-outputs
          path: out/
